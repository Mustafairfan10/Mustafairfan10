<svg width="1200" height="250" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1200" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0B1735"/>
      <stop offset="1" stop-color="#062235"/>
    </linearGradient>
    <linearGradient id="footerLine" x1="68" y1="0" x2="1132" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="footerGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="footerClip">
      <rect width="1200" height="250" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect width="1200" height="250" rx="24" fill="url(#footerBg)"/>
    <rect width="1200" height="250" fill="url(#footerGrid)"/>
    <rect x="68" y="35" width="1064" height="2" rx="1" fill="url(#footerLine)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/>
    </rect>

    <g font-family="'Segoe UI', Inter, Arial, sans-serif">
      <text x="72" y="93" fill="#38BDF8" font-size="13" font-weight="700" letter-spacing="4">READY FOR THE NEXT CHALLENGE</text>
      <text x="70" y="153" fill="#F8FAFC" font-size="43" font-weight="800" letter-spacing="-1">Let’s build what’s next.</text>
      <text x="72" y="192" fill="#94A3B8" font-size="17">Web applications • Mobile experiences • Unity products • AI systems</text>
    </g>

    <g transform="translate(850 75)">
      <circle cx="104" cy="50" r="62" stroke="#2563EB" stroke-opacity="0.24"/>
      <circle cx="104" cy="50" r="45" stroke="#22D3EE" stroke-opacity="0.25">
        <animate attributeName="r" values="40;51;40" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.12;0.42;0.12" dur="4s" repeatCount="indefinite"/>
      </circle>
      <path d="M62 50H145M122 27L146 50L122 73" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="-5 0;6 0;-5 0" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <circle cx="24" cy="50" r="4" fill="#8B5CF6">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="184" cy="50" r="4" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="1128" y="223" fill="#475569" font-family="monospace" font-size="12" text-anchor="end">github.com/Mustafairfan10</text>
  </g>
</svg>
