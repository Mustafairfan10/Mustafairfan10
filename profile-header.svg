      </circle>
      <circle cx="904" cy="87" r="5" fill="#60A5FA"/>
      <circle cx="1040" cy="88" r="5" fill="#8B5CF6"/>
      <circle cx="1040" cy="166" r="5" fill="#22D3EE"/>
      <circle cx="904" cy="166" r="5" fill="#38BDF8"/>
