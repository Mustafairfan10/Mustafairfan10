    <g transform="translate(824 248)" font-family="monospace">
      <text x="0" y="0" fill="#60A5FA" font-size="34" font-weight="700">&lt;</text>
      <text x="39" y="0" fill="#22D3EE" font-size="34" font-weight="700">/</text>
      <text x="67" y="0" fill="#8B5CF6" font-size="34" font-weight="700">&gt;</text>
