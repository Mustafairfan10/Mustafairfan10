      <text x="70" y="163" fill="#F8FAFC" font-size="68" font-weight="800" letter-spacing="-2">Mustafa Irfan</text>
      <rect x="72" y="184" width="492" height="3" rx="1.5" fill="url(#accent)">
        <animate attributeName="width" values="130;492;130" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="72" y="226" fill="#CBD5E1" font-size="22" font-weight="500">Software Engineer &amp; Founder at DivLynx</text>

      <g font-size="14" font-weight="700">
        <rect x="72" y="260" width="128" height="38" rx="19" fill="#0F2445" stroke="#2563EB" stroke-opacity="0.8"/>
        <text x="100" y="284" fill="#BFDBFE">FULL-STACK</text>
