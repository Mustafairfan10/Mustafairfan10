    <path d="M-60 292C219 189 414 366 700 232C892 142 1020 147 1265 30" stroke="url(#accent)" stroke-opacity="0.14" stroke-width="70" filter="url(#softGlow)">
      <animate attributeName="stroke-opacity" values="0.08;0.22;0.08" dur="5s" repeatCount="indefinite"/>
    </path>

    <g opacity="0.88">
      <path d="M904 87L971 48L1040 88L1040 166L972 205L904 166V87Z" stroke="#38BDF8" stroke-opacity="0.36"/>
